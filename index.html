<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camellia - Ugears Gallery</title>
    <link rel="stylesheet" href="style.css">
    <!-- GSAP Libraries (Обов'язкові для анімацій та перетягування) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>
</head>
<body>

    <div id="preloader-overlay"></div>

    <header class="header">
        <a href="#" class="logo-container">Camellia</a>
    </header>

    <div class="viewport" id="viewport">
        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="grid-container" id="gridContainer"></div>
        </div>
    </div>

    <!-- Модальний режим перегляду зображення -->
    <div class="split-screen-container" id="splitScreenContainer">
        <div class="split-left">
            <div class="zoom-target" id="zoomTarget"></div>
        </div>
        <div class="split-right">
            <div class="image-title-overlay" id="imageTitleOverlay">
                <div class="image-slide-number" id="imageSlideNumber"><span>01</span></div>
                <div class="image-slide-title" id="imageSlideTitle"><h1>Camellia Reference</h1></div>
                <p class="image-slide-description" id="imageSlideDescription">Опис зображення...</p>
            </div>
        </div>
    </div>

    <button class="close-button" id="closeButton">✕</button>

    <div class="controls-container" id="controlsContainer">
        <div class="percentage-indicator" id="percentageIndicator">60%</div>
        <button class="switch-button" onclick="gallery.setZoom(0.4, this)">40%</button>
        <button class="switch-button switch-button-current" onclick="gallery.setZoom(0.6, this)">60%</button>
        <button class="switch-button" onclick="gallery.setZoom(1.0, this)">100%</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
